# Corpus manifest for Biobot. Configuration only (no case text), so it is tracked in Git.
#
#   debate build-corpus  -> reads the licensed PDF and writes generated files under corpus_dir
#   debate ingest        -> loads generated + curated files, validates them, embeds every chunk
#
# Every chunk carries an `as_of` date (YYYY, YYYY-MM or YYYY-MM-DD): the date the information refers to.
company_id: biobot
corpus_dir: case_study/corpus        # git-ignored with case_study/: everything in it derives from the licensed case

case:
  path: case_study/01.BiobotAnalytics.pdf
  title: 'HBS case 821-045, "Biobot Analytics"'
  published: "2021-04"               # first published 2021; revised June 2023
  as_of: "2017"                      # the case's present: the founders' 2017 decision
  narrative_pages: [1, 13]
  caption_pages: [14, 21]            # exhibits 1-4 are figures: only their captions are text
  endnote_pages: [25, 27]

topics:                              # one generated narrative file per topic, in this order
  decision_context: Decision context
  founders_team: Founders and team
  origin_research: Origin - the Underworlds research project
  science_and_prior_art: Wastewater epidemiology and prior art
  technology_ip: Technology, robots and IP
  market: Market, trends and sizing inputs
  customers_go_to_market: Customers and go-to-market
  competition_and_precedents: Competition, alternatives and precedents
  risks_and_objections: Risks and objections
  financials: Funding and financials   # case facts, Exhibit 7, and post-2017 funding/contracts from the public ledger
  company_history: Company history after 2017 (public sources)

# Default topic for each case section heading ("(intro)" = text before the first heading).
section_topics:
  "(intro)": decision_context
  "Matus and Ghaeli": founders_team
  "Wastewater Epidemiology": science_and_prior_art
  "The Underworlds Project": technology_ip
  "Matus’ Other Ideas": founders_team
  "Beginning Biobot": founders_team
  "Market Trends": market
  "Intellectual Property": technology_ip
  "Gauging the Market": customers_go_to_market
  "Hardware or Software?": technology_ip
  "A Pipe Dream Worth Chasing?": risks_and_objections

# Paragraph-level overrides, keyed by the paragraph's opening words. The build fails if a key matches no
# paragraph (or more than one), so this mapping cannot silently drift when extraction changes.
paragraph_topics:
  "The core idea for Biobot was an outgrowth": origin_research
  "Matus and Ghaeli thought they could take": risks_and_objections   # continues onto p.2 (IP, careers)
  "Matus was the first of the two": origin_research
  "She helped undertake a first pilot": origin_research
  "Alongside advancements in understanding": competition_and_precedents
  "In a more ambitious effort, the Australian": competition_and_precedents
  "The growing interest in wastewater testing also prompted": risks_and_objections
  "The global water and wastewater treatment market": market
  "Early on, even as Ghaeli and Matus spent time": origin_research
  "Then, Ghaeli remembered, they began discovering": customers_go_to_market
  "At the same time, as communities seemed": origin_research
  "But any prospect for what could become Biobot": risks_and_objections
  "Matus and Ghaeli believed they were onto": market
  "Opioid addiction turned out to be": market
  "Measuring opioid use in wastewater": market
  "Ghaeli and Matus also had to make a decision about how": founders_team
  "At this point, Ghaeli and Matus had to decide": decision_context
  "Matus and Ghaeli gained admission to delta v": decision_context

exhibits:
  - {id: ex5, number: 5, page: 22, layout: matrix, header_lines: 2, groups: [Public sector, Private sector],
     topic: customers_go_to_market, as_of: "2017"}
  - {id: ex6, number: 6, page: 23, layout: matrix, header_lines: 2, groups: [Public health applications],
     topic: customers_go_to_market, as_of: "2017"}
  - {id: ex7, number: 7, page: 24, layout: budget, topic: financials, as_of: "2017-07",
     columns: {fy16: FY16 expenditures, fy17: FY17 budget, fy18: FY18 budget}}

caption_as_of:                       # figure exhibits: date of what each figure shows
  14: "1854"                         # Exhibit 1: John Snow's cholera map
  15: "2017-03"                      # Exhibit 2: ACIC wastewater drug monitoring report 1
  16: "2017"                         # Exhibit 3a-c: Underworlds findings
  17: "2017"
  18: "2017"
  19: "2016"                         # Exhibit 4a-b: Underworlds robots
  20: "2016"
  21: "2016"

endnote_dates:                       # where a citation's own date is ambiguous (e.g. "Forecast: 2016: 2022")
  "15": "2016"
  "16": "2016"
  "17": "2016"

# Public, source-linked research ledger (not from the licensed case). One chunk per table row, list item or paragraph,
# dated per item: the row's date column, else a year in the item's bold lead ("**Cary pilot, 2018.**"), else the
# latest publication date it cites, else the section's "(checked YYYY-MM-DD)". Undated items fail the build.
public_sources:
  - id: public
    path: case_study/public_data.md
    title: Biobot public data and source ledger
    checked: "2026-10-22"
    sections:                        # heading (without "(checked ...)") -> topic, and how much to trust it
      "Check of the requested milestones": {topic: company_history}
      "History and operating milestones": {topic: company_history}
      "Company and offering": {topic: customers_go_to_market}
      "Current product catalog and delivery model": {topic: technology_ip}
      "Competitors, alternatives, and procurement substitutes": {topic: competition_and_precedents}
      "Funding and investors": {topic: financials}
      "Contracts, customers, and adoption signals": {topic: customers_go_to_market}
      "Public measurements and reusable datasets": {topic: science_and_prior_art}
      "Named customer examples and what they show": {topic: customers_go_to_market}
      "Technology and intellectual property": {topic: technology_ip}
      "Research and performance evidence": {topic: science_and_prior_art}
      "Business and market evidence, with limits": {topic: financials}
      "Research findings and measurement cautions": {topic: risks_and_objections}
      "Screenshot-only funding leads supplied with this request": {topic: financials, reliability: lead}
    item_topics:                     # item opening words -> topic, where an item belongs elsewhere than its section
      "Public price point": financials
      "Origin": founders_team
      "Government contract concentration": risks_and_objections
      "Privacy and representativeness": risks_and_objections
    # Items with no date of their own are dated to `checked` (they describe the current state); this
    # overrides that when the item is about a past period.
    item_dates:
      "Cary outcome claim": "2019"   # outcomes reported for the year after the 2018 pilot

curated:                             # hand-written, never overwritten by build-corpus
  facts: case_study/corpus/facts.yaml
  assumptions: case_study/corpus/assumptions.yaml
  sizing: case_study/corpus/sizing.yaml
