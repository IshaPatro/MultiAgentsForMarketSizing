# The simulated "today" for each era. Everything an agent may know must be dated <= cutoff.
# forbidden_terms: case-insensitive regexes that are an automatic anachronism if they appear in a turn.
pre_covid:
  cutoff_date: 2017-12-31
  description: Seed-stage bet; the HBS case is set in 2017.
  forbidden_terms:
    - 'covid'
    - 'sars-?cov'
    - 'national wastewater surveillance'
    - 'omicron'
post_covid:
  cutoff_date: 2021-12-31   # placeholder; confirm in Phase 6
  description: After COVID made wastewater surveillance mainstream.
  forbidden_terms: []
