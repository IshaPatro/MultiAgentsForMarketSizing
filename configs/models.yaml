# Tier -> model. System 2 = Claude. System 1 (JEV) arrives in Phase 4.
# Prices are USD per million tokens (cached 2026-10-06 from the Claude API docs).
tiers:
  debate:                       # CEO / CFO / CTO / Devil's Advocate / VC questions
    model: claude-sonnet-5-5
    effort: low                 # 60-word replies do not need long deliberation
    max_tokens: 1024            # headroom for adaptive thinking + the JSON reply
  decision:                     # final VC call (Phase 7)
    model: claude-opus-5-5
    effort: high
    max_tokens: 4096
prices:
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
limits:
  max_words_per_turn: 60
  max_rounds: 3
  max_brevity_retries: 1
  max_cost_usd_per_run: 1.00
  context_turns: 6            # verbatim turns shown to each agent (rolling summary arrives in Phase 4)
