# Postgres + pgvector. Used from Phase 2 (RAG) and Phase 5 (checkpointer/store).
# Phase 1 runs on SQLite and does not need this.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: debate
      POSTGRES_PASSWORD: debate
      POSTGRES_DB: debate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate -d debate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
