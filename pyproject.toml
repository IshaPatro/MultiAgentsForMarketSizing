[project]
name = "debate"
version = "0.1.0"
description = "NextGen Boardroom — Where bold ideas meet hard questions."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.16",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langgraph-checkpoint-postgres>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ipykernel>=6"]   # ipykernel: run main.ipynb on this venv

[project.scripts]
debate = "debate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
